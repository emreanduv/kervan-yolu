name: Kervan Yolu (Meta Quest APK)
# Quest'te 2D panel uygulaması olarak açılan doğal Android (Capacitor) paketi. Meta web uygulaması (PWA/TWA) paketlerini
# yalnız ücretsiz satıyor; Kervan Yolu Quest'te 1,99 $ tam oyun olduğu için doğal paket (28 Kasım 2026).
# KY_MAGAZA='quest': Tam Sürüm kilidi ve uygulama içi puan yok; Google'a bağlı eklentiler (Play Billing, In-App Review)
# ve bildirim eklentisi pakete girmez. Meta bildirim şartları araclar/quest-yama.py'de.
# İmza: yükleme anahtarı (ANDROID_KEYSTORE_B64 sırrı). Tetik: store/TETIK-QUEST (1. satır sürüm adı, 2. satır sürüm kodu).
on:
  push:
    branches: [main]
    paths: ['store/TETIK-QUEST']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm
        run: |
          VN=$(sed -n 1p store/TETIK-QUEST); VC=$(sed -n 2p store/TETIK-QUEST)
          echo "VN=$VN" >> $GITHUB_ENV; echo "VC=$VC" >> $GITHUB_ENV; echo "Sürüm $VN ($VC)"
      - name: Yayın öncesi kontrol
        env: { SURUM: "${{ env.VN }}" }
        run: bash araclar/yayin-kontrol.sh
      - name: Quest mağaza işareti ve görüş adresi
        env: { FM: "${{ vars.FEEDBACK_MAIL }}" }
        run: printf "window.FEEDBACK_MAIL='%s';\nwindow.KY_MAGAZA='quest';\n" "${FM:-emreanduvart@gmail.com}" > www/iletisim.js
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Quest'e uymayan eklentileri çıkar
        run: npm uninstall --no-audit --no-fund @capgo/native-purchases @capacitor-community/in-app-review @capacitor/local-notifications
      - run: npx cap sync android
      - name: Meta bildirim şartları (paket adı, SDK 29/34, panel uygulaması)
        run: python3 araclar/quest-yama.py android
      - name: Yükleme anahtarı
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_B64 sırrı yok; Meta imzasız APK kabul etmez"; exit 1; fi
          printf '%s' "$KS" | base64 -d > $RUNNER_TEMP/upload.jks; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
      - name: APK derle
        working-directory: android
        env:
          VERSION_CODE: ${{ env.VC }}
          VERSION_NAME: ${{ env.VN }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: kervanyolu
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Denetle ve yayınla
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt dump badging $APK | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission|uses-feature"
          $BT/aapt dump badging $APK | grep -q "targetSdkVersion:'34'"
          $BT/aapt dump badging $APK | grep -q "name='com.anduv.kervanyolu.vr'"
          ! $BT/aapt dump permissions $APK | grep -E "BILLING|POST_NOTIFICATIONS|SCHEDULE_EXACT_ALARM"
          java -jar $BT/lib/apksigner.jar verify --verbose --print-certs $APK | grep -E "v2 scheme|SHA-256" | head -3
          rm -f $RUNNER_TEMP/upload.jks
          AD=kervan-yolu-quest-${{ env.VN }}-${{ env.VC }}.apk; cp $APK /tmp/$AD
          T=quest-${{ env.VN }}-${{ env.VC }}-${{ github.run_number }}
          gh release create "$T" -R "${{ github.repository }}" --title "Kervan Yolu Quest ${{ env.VN }} (${{ env.VC }}) doğal paket" --notes "Meta Horizon Store için imzalı doğal APK (2D panel, 1,99 $ tam oyun)" --prerelease "/tmp/$AD"
