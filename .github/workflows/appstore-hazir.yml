name: App Store — incelemeye hazırla
# store/TETIK-APPSTORE değişince: metin + ekran görüntüleri (fastlane deliver), sonra
# yaş, fiyat 1,99 $, bölgeler, inceleme bilgileri ve derleme seçimi (araclar/appstore-hazirla.py). Göndermez.
on:
  push:
    branches: [main]
    paths: ['store/TETIK-APPSTORE']
  workflow_dispatch:
env:
  ASC_KEY_ID: DJSHKK6T3P
  ASC_ISSUER_ID: f4943ef8-df6f-42c8-a561-58554097ea35
  APP_ID: "6837800818"
  SURUM: "1.1.7"
jobs:
  metin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yayın öncesi kontrol
        run: bash araclar/yayin-kontrol.sh
      - name: Metin ve görselleri hazırla
        run: |
          mkdir -p fastlane/screenshots/tr fastlane/screenshots/en-US fastlane/metadata
          echo '# deliver ayarları komut satırından veriliyor' > fastlane/Deliverfile
          for L in tr en; do D=tr; [ $L = en ] && D=en-US; for K in iphone69 ipad13; do for f in store/screenshots/$L/$K/*.png; do cp "$f" fastlane/screenshots/$D/${K}_$(basename $f); done; done; done
          cp -r store/appstore-metadata/* fastlane/metadata/
      - name: Anahtar
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: python3 -c "import json,os; json.dump({'key_id':os.environ['ASC_KEY_ID'],'issuer_id':os.environ['ASC_ISSUER_ID'],'key':os.environ['P8'],'in_house':False}, open('api_key.json','w'))"
      - name: Gönderilmemiş taslağı kaldır (sürüm düzenlenebilsin)
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: pip3 install --break-system-packages -q pyjwt cryptography requests 2>/dev/null || pip3 install -q pyjwt cryptography requests; python3 araclar/taslak-iptal.py
      - name: Yükle
        env: { CI: "true", FASTLANE_SKIP_UPDATE_CHECK: "1", FASTLANE_HIDE_CHANGELOG: "1" }
        run: |
          fastlane deliver --api_key_path api_key.json --app_identifier com.anduv.kervanyolu \
            --app_version "$SURUM" --skip_binary_upload true --skip_app_version_update false \
            --screenshots_path fastlane/screenshots --metadata_path fastlane/metadata --overwrite_screenshots true \
            --precheck_include_in_app_purchases false --force true --run_precheck_before_submit false --submit_for_review false > $RUNNER_TEMP/deliver.log 2>&1 || {
              grep -iE 'error|invalid|\[!\]|failed|must|exceed|could not' $RUNNER_TEMP/deliver.log | grep -v '^\s*$' | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
              tail -8 $RUNNER_TEMP/deliver.log | while IFS= read -r l; do echo "::warning::$l"; done
              exit 1; }
          tail -5 $RUNNER_TEMP/deliver.log
  ayarlar:
    needs: metin
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography requests
      - name: Yaş, fiyat, bölgeler, inceleme bilgileri, derleme
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: python3 araclar/appstore-hazirla.py
