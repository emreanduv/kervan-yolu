:root{--g1:#2d4a36;--g2:#1a2b20;--acc:#f2b632;--txt:#e8efe6;--mut:#9fb3a3}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;font-family:Rubik,system-ui,sans-serif;color:var(--txt);touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);z-index:20;background:radial-gradient(ellipse at 50% 0%,rgba(242,182,50,.16),transparent 60%),linear-gradient(180deg,rgba(10,20,14,.55),rgba(10,20,14,.93))}
.scr.on{display:flex}
.panel{width:min(460px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#22382a,#152219);border:1px solid #3c5c45;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.phead{background:linear-gradient(180deg,#4b7a57,#2f523a);padding:10px 14px;font-family:'Barlow Condensed';font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;border-bottom:1px solid #1a2b20;display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.pbody{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.logo{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(40px,11vw,58px);letter-spacing:.04em;line-height:.9;text-align:center;background:linear-gradient(180deg,#fff2c9,#f2b632 55%,#c27f12);-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}
.crest{display:inline-block;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:.2em;color:#2a1a00;background:var(--acc);padding:2px 8px;border-radius:3px;margin-bottom:6px}
.sub{text-align:center;color:var(--mut);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.btn{display:inline-block;padding:11px 14px;border-radius:4px;border:1px solid #4a5d50;background:linear-gradient(180deg,#3a4a3f,#26332a);color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn.blk{display:block;width:100%;margin-top:9px;padding:14px}
.btn.go{background:linear-gradient(180deg,#5d9467,#3b6a45);border-color:#6b9a73}
.btn.gold{background:linear-gradient(180deg,#f6c64e,#d08e16);border-color:#ffd77a;color:#2a1a00}
.btn.sm{padding:6px 11px;font-size:15px}
.tabs{display:flex;border-bottom:1px solid #1a2b20;flex:none}
.tab{flex:1;padding:12px 6px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:#1b2c21;cursor:pointer;border-right:1px solid #12201a}
.tab.on{color:#fff;background:linear-gradient(180deg,#3f6a4a,#2a4a33);box-shadow:inset 0 -3px 0 var(--acc)}
.sig{font-size:12.5px;color:#cfdccf;opacity:.85;font-style:italic}
.made{margin-top:12px;text-align:center;flex:none}
.desc{font-size:14px;line-height:1.45;color:#d6e2d6}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-size:14px}
.kv:nth-child(odd){background:rgba(255,255,255,.04)}
.kv b{font-family:'Barlow Condensed';font-size:17px;letter-spacing:.03em;text-align:right}
.neg{color:#ff8a7f}.pos{color:#8ff0a4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chip{flex:1;min-width:70px;padding:8px 6px;text-align:center;border-radius:4px;border:1px solid #3c5c45;background:#1b2c21;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.05em;color:var(--mut);cursor:pointer}
.chip.on{color:#2a1a00;background:var(--acc);border-color:#ffd77a}
.alt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #1a2b20;background:#14211a;flex:none}
.alt .sp{flex:1}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.tip{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px;line-height:1.4}
.tip b{font-family:'Barlow Condensed';font-size:16px;letter-spacing:.04em;color:#ffe29a}
.jobcard{border:1px solid #3c5c45;border-left:4px solid var(--acc);background:rgba(0,0,0,.18);border-radius:4px;padding:10px 12px;margin-top:8px}
.jobcard h3{margin:0 0 6px;font-family:'Barlow Condensed';font-size:21px;letter-spacing:.04em}
.hist{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.hist span{font-family:'Barlow Condensed';font-size:13px;background:#1b2c21;border:1px solid #2f4a37;border-radius:3px;padding:2px 6px;color:#cfe0cf}
.hud{position:fixed;z-index:10;pointer-events:none;font-family:'Barlow Condensed';display:none}
.hud.on{display:block}
#obj{top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:rgba(15,26,19,.84);border:1px solid #3c5c45;border-left:4px solid var(--acc);padding:7px 12px;border-radius:4px;font-size:clamp(13px,3.6vw,16px);font-weight:600;max-width:min(560px,62vw);text-align:center;letter-spacing:.02em}
#speedo{right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 58px);text-align:right;background:rgba(15,26,19,.8);border:1px solid #3c5c45;border-radius:6px;padding:6px 10px;min-width:108px}
#speedo .v{font-size:40px;font-weight:800;line-height:1}
#speedo .u{font-size:12px;color:var(--mut);letter-spacing:.15em}
#speedo .row{font-size:14px;margin-top:4px;display:flex;justify-content:space-between;gap:10px}
#mini{left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 58px);width:112px;height:112px;border-radius:50%;border:2px solid #3c5c45;background:rgba(15,26,19,.82);overflow:hidden}
#toast{position:fixed;z-index:25;top:38%;left:50%;transform:translate(-50%,-50%);font-family:'Barlow Condensed';font-size:25px;font-weight:800;letter-spacing:.04em;text-shadow:0 3px 14px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;text-align:center;pointer-events:none;max-width:92vw}
#coach{position:fixed;z-index:14;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);width:min(380px,74vw);background:rgba(20,34,25,.94);border:1px solid #6b9a73;border-left:4px solid var(--acc);border-radius:6px;padding:9px 12px;font-size:13.5px;line-height:1.4;display:none;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#coach b{display:block;font-family:'Barlow Condensed';font-size:17px;letter-spacing:.04em;color:#ffe29a;margin-bottom:2px}
.ctl{position:fixed;z-index:12;display:none;bottom:calc(env(safe-area-inset-bottom) + 14px)}
.ctl.on{display:flex}
.cb{width:74px;height:74px;border-radius:50%;background:rgba(20,34,25,.72);border:2px solid rgba(160,200,170,.45);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 6px;touch-action:none;font-family:'Barlow Condensed';font-weight:800}
.cb.down{background:rgba(242,182,50,.55);border-color:#ffd77a}
.tri{width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent}
.tri.l{border-right:20px solid #fff;margin-right:4px}.tri.r{border-left:20px solid #fff;margin-left:4px}
.tri.u{border:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:22px solid #fff}
.tri.d{border:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:18px solid #fff}
#cl{left:calc(env(safe-area-inset-left) + 8px)}#cr{right:calc(env(safe-area-inset-right) + 8px);align-items:flex-end}
#cr .gas{height:110px;width:70px;border-radius:14px;flex-direction:column;gap:6px}
#cr .brk{height:74px;width:70px;border-radius:14px;flex-direction:column;gap:4px}
.cb small{font-size:12px;letter-spacing:.1em}
#act{position:fixed;z-index:13;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 104px);display:none;padding:13px 26px;border-radius:30px;background:linear-gradient(180deg,#f6c64e,#d08e16);border:2px solid #ffe29a;color:#2a1a00;font-family:'Barlow Condensed';font-weight:800;font-size:21px;letter-spacing:.08em;box-shadow:0 0 24px rgba(242,182,50,.6);animation:pulse 1.2s infinite;white-space:nowrap}
#act.on{display:block}
@keyframes pulse{50%{box-shadow:0 0 40px rgba(242,182,50,.95)}}
.tb{position:fixed;z-index:12;display:none;top:calc(env(safe-area-inset-top) + 10px);width:42px;height:42px;border-radius:8px;background:rgba(15,26,19,.82);border:1px solid #3c5c45;color:#fff;font-size:19px;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800}
.tb.on{display:flex}
#bcam{right:calc(env(safe-area-inset-right) + 10px)}#hPause{left:calc(env(safe-area-inset-left) + 10px)}#hSnd{right:calc(env(safe-area-inset-right) + 58px)}
#load{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#0b1410;font-family:'Barlow Condensed';font-size:22px;letter-spacing:.2em;color:var(--acc)}
#load.on{display:flex}
.stars{text-align:center;font-size:34px;color:var(--acc);letter-spacing:6px;margin:4px 0 2px}
.small{font-size:12px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.4}
#rateBox{display:none;margin-top:10px;padding:10px;border:1px solid #6b9a73;border-radius:5px;background:rgba(0,0,0,.2);font-size:14px;text-align:center}
#fList{margin:8px 0;padding-left:20px;font-size:14px;line-height:1.5}
.price{font-family:'Barlow Condensed';font-size:26px;font-weight:800;color:var(--acc);text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.btns .btn{flex:1}
</style>

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,x)=>a+(b-a)*x;
const sstep=(a,b,x)=>{const q=clamp((x-a)/(b-a),0,1);return q*q*(3-2*q)};
function hash2(i,j){let n=Math.imul(i,374761393)^Math.imul(j,668265263);n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967295}
function vnoise(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v)*2-1}
function fbm(x,z,o=5){let s=0,a=1,f=1,n=0;for(let k=0;k<o;k++){s+=vnoise(x*f+k*17.3,z*f-k*9.1)*a;n+=a;a*=.5;f*=2.03}return s/n}

function sefer(n){const first=['kasa','kule','kanat'];const pool=['kasa','kule','kanat','yedek','donus','kasa','yedek','kule','kanat','donus'];
 const type=n<=3?first[n-1]:pool[Math.floor(hash2(n,77)*pool.length)];const tod=n===1?'aksam':n===2?'ogle':n===3?'sabah':TODS[Math.floor(hash2(n,5)*4)];

 const rd=getRD(v.x,v.z);v.off=rd>6.2&&yardMask(v.x,v.z)<.5&&siteMask(v.x,v.z)<.5;if(v.off)acc-=v.speed*.35;

let AC=null,eng=null;function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=320;g.gain.value=0;o1.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);o1.start();o2.start();eng={o1,o2,f,g}}catch(e){}}

function updAudio(){if(!eng)return;try{const playing=state==='play'&&(phase==='drive'||phase==='fork')&&!SAVE.muted;const v=phase==='fork'?fork.v:truck.v;const s=Math.abs(v.speed),th=input.gas?1:0;const rpm=phase==='fork'?(45+s*14):(32+((s*3.6)%28)*1.6+s*.9);
 eng.o1.frequency.setTargetAtTime(rpm,AC.currentTime,.08);eng.o2.frequency.setTargetAtTime(rpm*.5,AC.currentTime,.08);eng.f.frequency.setTargetAtTime(220+th*380+s*8,AC.currentTime,.1);eng.g.gain.setTargetAtTime(playing?(.035+th*.03):0,AC.currentTime,.15)}catch(e){}}

function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!built){renderer.setClearColor(0x0b1410);renderer.clear();return}
 const run=state==='play';
 if(G&&run){G.t+=dt;if(G.warnT>0)G.warnT-=dt;
  if(phase==='fork'){vehStep(fork.v,dt,input,G.carry>=0?.85:1);forkLogic()}
  else if(phase==='drive'){const lockGas=mode==='career'&&!G.strapped;const inp=lockGas?{left:input.left,right:input.right,gas:0,brake:input.brake}:input;vehStep(truck.v,dt,inp,mode==='career'?JT[G.job.type].acc:1);driveLogic(dt)}
  if(phase==='drive'&&input.gas&&Math.random()<.5){truck.g.updateMatrixWorld();for(const s of[1,-1]){_v.set(s*1.12,4.65,-2.86).applyMatrix4(truck.g.matrixWorld);emit(_v.x,_v.y,_v.z,(Math.random()-.5)*.6,2.2,(Math.random()-.5)*.6,.5,1.4,CUR_TOD==='gece'?'#2a2c30':'#55524e',.35)}}
  if(phase==='drive'&&truck.v.off&&Math.abs(truck.v.speed)>3&&Math.random()<.7){_v.set(0,.6,13).applyMatrix4(trailer.g.matrixWorld);emit(_v.x+(Math.random()-.5)*2,_v.y,_v.z,(Math.random()-.5),1,(Math.random()-.5),1.6,1.6,'#b99b72',.45)}
  coachTick(dt)}
 if(G&&(run||phase==='drone'))placeVehicles(run?dt:0);
 for(const r of world.rotors)r.r.rotation.z+=dt*r.s;
 const blink=Math.sin(now*.004)>.6;for(const l of world.lights)l.visible=blink;
 if(pickRing&&pickRing.visible){const s2=1+Math.sin(now*.005)*.05;pickRing.scale.set(s2,s2,1);pickBeam.material.opacity=.11+Math.sin(now*.004)*.05}
 if(ring&&ring.visible){const s=1+Math.sin(now*.004)*.04;ring.scale.set(s,s,1);ringBeam.material.opacity=.09+Math.sin(now*.003)*.04}
 if(world.flag)world.flag.rotation.y=Math.sin(now*.003)*.25;

  drawMini()}
 renderer.render(scene,camera)}
